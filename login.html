<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Pinnacle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-secondary d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-4 shadow text-center">
                    <h3 class="mb-4">Member Login</h3>
                    <form action="index.html">
                        <input type="email" class="form-control mb-3" placeholder="Email Address">
                        <input type="password" class="form-control mb-3" placeholder="Password">
                        <button class="btn btn-dark w-100">Enter Dashboard</button>
                        <div class="mt-3">
                            <a href="index.html" class="text-muted small">Cancel and Logout</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
