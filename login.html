<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In | Pinnacle Web Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow border-0">
                    <div class="card-body p-4">
                        <h4 class="text-center mb-4">Log In</h4>
                        <form>
                            <input type="email" class="form-control mb-3" placeholder="Email">
                            <input type="password" class="form-control mb-3" placeholder="Password">
                            <button type="button" class="btn btn-dark w-100 mb-2" onclick="alert('Logged In!')">Enter Dashboard</button>
                            <a href="index.html" class="btn btn-outline-danger w-100">Cancel & Logout</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
