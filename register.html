<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Pinnacle Web Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0">
                    <div class="card-body p-5 text-center">
                        <h3 class="mb-4">Create Account</h3>
                        <form action="services.html">
                            <input type="text" class="form-control mb-3" placeholder="Full Name" required>
                            <input type="email" class="form-control mb-3" placeholder="Email Address" required>
                            <input type="password" class="form-control mb-3" placeholder="Password" required>
                            <div class="mb-3 text-start">
                                <label class="form-label small text-danger">Verification Required:</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="ageCheck" required>
                                    <label class="form-check-label small" for="ageCheck">
                                        I confirm I am 18 years of age or older.
                                    </label>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Register</button>
                        </form>
                        <p class="mt-3 small">Already have an account? <a href="login.html">Log In</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
